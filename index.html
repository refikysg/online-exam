<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Online Examination Portal</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .exam-container {
            max-width: 800px;
            width: 100%;
            background: var(--card-background);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        h1 { margin: 0; font-size: 24px; color: #0f172a; }

        .timer-box {
            background-color: #fee2e2;
            color: #991b1b;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
        }

        .question-card {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #fafafa;
        }

        .question-text { font-size: 18px; font-weight: 600; margin-bottom: 15px; }
        .options-list { list-style: none; padding: 0; margin: 0; }
        
        .option-item {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .option-item input[type="radio"] {
            margin-right: 12px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .option-item label {
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            padding: 8px;
            border-radius: 4px;
        }

        .option-item label:hover { background-color: #f1f5f9; }

        .submit-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover { background-color: #1d4ed8; }

        #results-panel {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
        }
    </style>
</head>
<body>

<div class="exam-container">
    <header>
        <h1>Online Examination</h1>
        <div class="timer-box">Time Remaining: <span id="timer">05:00</span></div>
    </header>

    <form id="quizForm">
        <!-- Questions will be injected here automatically by JavaScript -->
        <div id="questions-container">Loading questions...</div>
        <button type="button" class="submit-btn" onclick="submitExam()">Submit Examination</button>
    </form>

    <div id="results-panel">
        <h2>Exam Completed!</h2>
        <p id="score-text"></p>
    </div>
</div>

<script>
    let examQuestions = [];
    let totalTime = 5 * 60; 
    const timerElement = document.getElementById('timer');
    let countdown;

    // 1. Fetch questions from the external JSON text file
    async function loadQuestions() {
        try {
            const response = await fetch('questions.json');
            examQuestions = await response.json();
            renderQuestions();
            startTimer();
        } catch (error) {
            document.getElementById('questions-container').innerText = "Failed to load questions. Make sure questions.json is in the same folder.";
            console.error("Error loading JSON:", error);
        }
    }

    // 2. Dynamically build the HTML for the questions
    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = ''; // Clear loading text

        examQuestions.forEach((q, index) => {
            let optionsHTML = '';
            
            // Loop through options (A, B, C...)
            for (let key in q.options) {
                optionsHTML += `
                    <li class="option-item">
                        <input type="radio" name="${q.id}" id="${q.id}_${key}" value="${key}">
                        <label for="${q.id}_${key}">${q.options[key]}</label>
                    </li>
                `;
            }

            const card = document.createElement('div');
            card.className = 'question-card';
            card.innerHTML = `
                <div class="question-text">${index + 1}. ${q.question}</div>
                <ul class="options-list">${optionsHTML}</ul>
            `;
            container.appendChild(card);
        });
    }

    // 3. Timer Engine
    function startTimer() {
        countdown = setInterval(() => {
            let minutes = Math.floor(totalTime / 60);
            let seconds = totalTime % 60;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            minutes = minutes < 10 ? '0' + minutes : minutes;

            timerElement.textContent = `${minutes}:${seconds}`;

            if (totalTime <= 0) {
                clearInterval(countdown);
                alert("Time's up!");
                submitExam();
            }
            totalTime--;
        }, 1000);
    }

    // 4. Submit & Auto-Grade Engine
    function submitExam() {
        clearInterval(countdown);
        
        const form = document.getElementById('quizForm');
        const formData = new FormData(form);
        let score = 0;

        examQuestions.forEach(q => {
            if (formData.get(q.id) === q.correct) {
                score++;
            }
        });

        form.style.display = 'none';
        document.querySelector('.timer-box').style.display = 'none';
        
        const resultsPanel = document.getElementById('results-panel');
        resultsPanel.style.display = 'block';
        document.getElementById('score-text').innerHTML = `You scored <strong>${score}</strong> out of <strong>${examQuestions.length}</strong>.`;
    }

    // Run on startup
    window.onload = loadQuestions;
</script>

</body>
</html>
